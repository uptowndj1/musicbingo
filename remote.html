<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Music Bingo remote</title>
<script>
// The remote moved. A phone opened from a home-screen shortcut (no pairing code in the address) brings its saved pairing along.
var h = location.hash;
if(!/[#&]t=/.test(h)){ try{ var t = localStorage.getItem('mbTopic'), r = localStorage.getItem('mbRelay'); if(t) h = '#t=' + t + (r ? '&r=' + encodeURIComponent(r) : ''); }catch(e){} }
location.replace('https://music-bingo-with-andrew.github.io/remote.html' + location.search + h);
</script>
</head><body style="background:#14161c;color:#e8e9ee;font:18px system-ui,sans-serif;text-align:center;padding-top:60px">
The Music Bingo remote has moved. <a style="color:#f2b134" href="https://music-bingo-with-andrew.github.io/remote.html">Tap here</a> if it doesn't open by itself.
</body></html>
