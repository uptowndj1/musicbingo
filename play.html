<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='31' fill='%23e8303a'/><circle cx='32' cy='32' r='20' fill='%23fff'/><g fill='%2314161e'><ellipse cx='23.5' cy='41' rx='4.7' ry='3.4'/><ellipse cx='39.5' cy='38' rx='4.7' ry='3.4'/><rect x='26' y='20' width='2.5' height='21'/><rect x='42' y='17' width='2.5' height='21'/><path d='M26 20 44.5 17v5.5L26 25.5z'/></g></svg>">
<title>Music Bingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14161c;--panel:#1d2029;--line:#2c3040;--text:#e8e9ee;--muted:#9097a8;--accent:#f2b134;--dab:#e8303a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:10px 6px 30px}
h1{margin:4px 0 2px;text-align:center;font:900 30px "Arial Black",Arial,sans-serif;color:var(--dab);letter-spacing:.5px}
.sub{text-align:center;color:var(--muted);margin-bottom:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center}
input{width:100%;font:900 44px "Courier New",monospace;letter-spacing:12px;text-align:center;text-transform:uppercase;padding:10px;border-radius:10px;border:1px solid #3a4052;background:#11131a;color:#fff}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:14px 18px;background:var(--accent);color:#1a1300;width:100%;margin-top:12px;font-size:18px}
button.plain{background:#2a2f3d;color:var(--text);font-weight:600;font-size:15px}
.msg{margin-top:12px;color:var(--muted);min-height:1.4em}.msg.err{color:#ff8fa0}
.banner{background:#1d3a2e;color:#c9f5df;border-radius:10px;padding:10px 12px;margin-bottom:10px;text-align:center;font-weight:700}
.pname{text-align:center;font-weight:800;font-size:20px;margin:2px 0 8px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:#fde8e8;border:3px solid #222;border-radius:10px;padding:3px;user-select:none}
.cell{aspect-ratio:1/1;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px;overflow:hidden;color:#111;
  font:700 13px/1.08 "Roboto Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;cursor:pointer;position:relative;word-break:normal;overflow-wrap:normal;hyphens:none}
.cell span{display:block;width:100%}
.cell.brk span{overflow-wrap:anywhere}
.cell.on{background:var(--dab);color:#fff}
.cell.free{background:#3a3214;color:var(--accent);font:900 15px Arial,sans-serif}
.foot{display:flex;align-items:center;gap:14px;margin-top:12px;background:var(--panel);border-radius:12px;padding:12px}
.qr{width:120px;height:120px;background:#fff;border-radius:8px;padding:4px;flex:none}.qr svg{width:100%;height:100%;display:block}
.no{font-size:13px;color:var(--muted)}.no b{display:block;font-size:30px;color:#fff;letter-spacing:2px}
.how{font-size:13px;color:var(--muted);margin-top:4px}
.wait{font-size:20px;font-weight:700;margin:6px 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#555;margin-right:6px}.dot.ok{background:#3ecf8e}
.status{text-align:center;font-size:12px;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>MUSIC BINGO</h1>
  <div class="sub">with Andrew</div>

  <div id="vCode" class="box" hidden>
    <div style="font-size:18px;margin-bottom:10px">Enter the 4-letter code</div>
    <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button id="go">Get my card</button>
    <div id="codeMsg" class="msg"></div>
  </div>

  <div id="vWait" class="box" hidden>
    <div class="wait" id="waitT">Connecting…</div>
    <div class="msg" id="waitMsg"></div>
    <button class="plain" id="chg1">Enter a different code</button>
  </div>

  <div id="vCard" hidden>
    <div id="banner" class="banner" hidden></div>
    <div id="pname" class="pname"></div>
    <div id="grid" class="grid"></div>
    <div class="foot">
      <div id="qr" class="qr"></div>
      <div><div class="no">Card number<b id="cno"></b></div>
        <div class="how">Tap a song when it plays. Got bingo? Shout it out and show this to Andrew.</div></div>
    </div>
    <button class="plain" id="chg2">Enter a different code</button>
  </div>
  <div class="status"><span id="dot" class="dot"></span><span id="stat"></span></div>
</div>
<script>
const $ = s => document.querySelector(s);
const PREFIX = 'mbdc7q-', CELLS = 24;
const hp = new URLSearchParams(location.hash.slice(1));
const RELAY = (hp.get('r') || 'https://ntfy.sh').replace(/\/+$/, '');
const ls = {get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }};

/* same card dealing as MusicBingo.html (keep these two functions identical there) */
function dcRand(str){
  let h = 2166136261; for(let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  let a = h >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function dealDigital(id, v, songs, n){
  const r = dcRand(id + ':' + v + ':' + n), idx = songs.map((_, i) => i);
  for(let i = idx.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); const t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
  return idx.slice(0, CELLS).map(i => songs[i]);
}

const QR = (() => {
  // [ec codewords per block, blocks in group 1, data codewords each, blocks in group 2, data codewords each]
  const EC_Q = [null,
    [13,1,13,0,0],[22,1,22,0,0],[18,2,17,0,0],[26,2,24,0,0],[18,2,15,2,16],
    [24,4,19,0,0],[18,2,14,4,15],[22,4,18,2,19],[20,4,16,4,17],[24,6,19,2,20]];
  const ALIGN = [null,[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50]];
  const FORMAT_Q = 3;
  function gfMul(x, y){ let z = 0; for(let i = 7; i >= 0; i--){ z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z; }
  function rsDivisor(deg){
    const r = new Array(deg).fill(0); r[deg - 1] = 1; let root = 1;
    for(let i = 0; i < deg; i++){
      for(let j = 0; j < deg; j++){ r[j] = gfMul(r[j], root); if(j + 1 < deg) r[j] ^= r[j + 1]; }
      root = gfMul(root, 0x02);
    }
    return r;
  }
  function rsRemainder(data, div){
    const r = new Array(div.length).fill(0);
    for(const b of data){ const f = b ^ r.shift(); r.push(0); for(let i = 0; i < r.length; i++) r[i] ^= gfMul(div[i], f); }
    return r;
  }
  function make(text){
    const bytes = [...new TextEncoder().encode(text)];
    let ver = 1;
    for(; ver <= 10; ver++){
      const e = EC_Q[ver], cap = e[1] * e[2] + e[3] * e[4];
      if(4 + (ver < 10 ? 8 : 16) + bytes.length * 8 <= cap * 8) break;
    }
    if(ver > 10) throw new Error('QR text too long');
    const [ecLen, g1, d1, g2, d2] = EC_Q[ver], cap = g1 * d1 + g2 * d2;
    // data bits
    const bits = [];
    const put = (v, n) => { for(let i = n - 1; i >= 0; i--) bits.push((v >>> i) & 1); };
    put(4, 4); put(bytes.length, ver < 10 ? 8 : 16); for(const b of bytes) put(b, 8);
    put(0, Math.min(4, cap * 8 - bits.length));
    while(bits.length % 8) bits.push(0);
    const data = []; for(let i = 0; i < bits.length; i += 8){ let v = 0; for(let j = 0; j < 8; j++) v = (v << 1) | bits[i + j]; data.push(v); }
    for(let p = 0; data.length < cap; p ^= 1) data.push(p ? 0x11 : 0xEC);
    // blocks + error correction, interleaved
    const blocks = [], div = rsDivisor(ecLen); let k = 0;
    for(let b = 0; b < g1 + g2; b++){ const n = b < g1 ? d1 : d2; const d = data.slice(k, k + n); k += n; blocks.push({d, e: rsRemainder(d, div)}); }
    const all = [], maxD = Math.max(d1, d2);
    for(let i = 0; i < maxD; i++) for(const bl of blocks) if(i < bl.d.length) all.push(bl.d[i]);
    for(let i = 0; i < ecLen; i++) for(const bl of blocks) all.push(bl.e[i]);
    // matrix
    const size = ver * 4 + 17;
    const mod = Array.from({length: size}, () => new Array(size).fill(false));
    const fn = Array.from({length: size}, () => new Array(size).fill(false));
    const set = (x, y, dark) => { mod[y][x] = dark; fn[y][x] = true; };
    for(let i = 0; i < size; i++){ set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    const finder = (x, y) => { for(let dy = -4; dy <= 4; dy++) for(let dx = -4; dx <= 4; dx++){ const d = Math.max(Math.abs(dx), Math.abs(dy)), xx = x + dx, yy = y + dy; if(xx >= 0 && xx < size && yy >= 0 && yy < size) set(xx, yy, d !== 2 && d !== 4); } };
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
    const al = ALIGN[ver], last = al.length - 1;
    for(let i = 0; i <= last; i++) for(let j = 0; j <= last; j++){
      if((i === 0 && j === 0) || (i === 0 && j === last) || (i === last && j === 0)) continue;
      for(let dy = -2; dy <= 2; dy++) for(let dx = -2; dx <= 2; dx++) set(al[i] + dx, al[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
    const drawFormat = mask => {
      const v = (FORMAT_Q << 3) | mask; let r = v;
      for(let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const b = ((v << 10) | r) ^ 0x5412, bit = i => ((b >>> i) & 1) === 1;
      for(let i = 0; i <= 5; i++) set(8, i, bit(i));
      set(8, 7, bit(6)); set(8, 8, bit(7)); set(7, 8, bit(8));
      for(let i = 9; i < 15; i++) set(14 - i, 8, bit(i));
      for(let i = 0; i < 8; i++) set(size - 1 - i, 8, bit(i));
      for(let i = 8; i < 15; i++) set(8, size - 15 + i, bit(i));
      set(8, size - 8, true);
    };
    drawFormat(0);
    if(ver >= 7){
      let r = ver; for(let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25);
      const b = (ver << 12) | r;
      for(let i = 0; i < 18; i++){ const d = ((b >>> i) & 1) === 1, a = size - 11 + i % 3, c = Math.floor(i / 3); set(a, c, d); set(c, a, d); }
    }
    // place data
    let i = 0;
    for(let right = size - 1; right >= 1; right -= 2){
      if(right === 6) right = 5;
      for(let vert = 0; vert < size; vert++) for(let j = 0; j < 2; j++){
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
        if(!fn[y][x] && i < all.length * 8){ mod[y][x] = ((all[i >>> 3] >>> (7 - (i & 7))) & 1) === 1; i++; }
      }
    }
    const maskFn = [
      (x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x, y) => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0,
      (x, y) => (x * y % 2 + x * y % 3) % 2 === 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0];
    const applyMask = m => { for(let y = 0; y < size; y++) for(let x = 0; x < size; x++) if(!fn[y][x] && maskFn[m](x, y)) mod[y][x] = !mod[y][x]; };
    const penalty = () => {
      let p = 0, dark = 0;
      const lines = [];
      for(let y = 0; y < size; y++){ lines.push(mod[y]); }
      for(let x = 0; x < size; x++){ lines.push(mod.map(r => r[x])); }
      for(const L of lines){
        let run = 1;
        for(let k = 1; k <= L.length; k++){
          if(k < L.length && L[k] === L[k - 1]) run++;
          else { if(run >= 5) p += run - 2; run = 1; }
        }
        const s = L.map(v => v ? 1 : 0).join('');
        for(const pat of ['10111010000', '00001011101']){ let at = s.indexOf(pat); while(at >= 0){ p += 40; at = s.indexOf(pat, at + 1); } }
      }
      for(let y = 0; y < size - 1; y++) for(let x = 0; x < size - 1; x++){ const c = mod[y][x]; if(c === mod[y][x + 1] && c === mod[y + 1][x] && c === mod[y + 1][x + 1]) p += 3; }
      for(const r of mod) for(const v of r) if(v) dark++;
      p += Math.floor(Math.abs(dark * 20 - size * size * 10) / (size * size)) * 10;
      return p;
    };
    let best = 0, bestP = Infinity;
    for(let m = 0; m < 8; m++){ applyMask(m); drawFormat(m); const p = penalty(); if(p < bestP){ bestP = p; best = m; } applyMask(m); }
    applyMask(best); drawFormat(best);
    return mod;
  }
  // SVG with a 4-module quiet zone.
  function svg(text){
    const m = make(text), n = m.length, q = 4, S = n + q * 2;
    let d = '';
    for(let y = 0; y < n; y++) for(let x = 0; x < n; x++) if(m[y][x]) d += `M${x + q} ${y + q}h1v1h-1z`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${S} ${S}" shape-rendering="crispEdges"><rect width="${S}" height="${S}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
  return {make, svg};
})();

let code = '', es = null, games = {}, current = null, shownKey = '';
function show(v){ for(const x of ['vCode', 'vWait', 'vCard']) $('#' + x).hidden = x !== v; }
function setStat(ok, t){ $('#dot').className = 'dot' + (ok ? ' ok' : ''); $('#stat').textContent = t; }

function askCode(msg){
  if(es){ es.close(); es = null; }
  show('vCode'); $('#code').value = code; $('#codeMsg').textContent = msg || ''; setStat(false, '');
}
$('#go').onclick = () => {
  const v = $('#code').value.toUpperCase().replace(/[^A-Z]/g, '');
  if(v.length !== 4){ $('#codeMsg').className = 'msg err'; $('#codeMsg').textContent = 'The code is 4 letters.'; return; }
  start(v);
};
$('#code').addEventListener('keydown', e => { if(e.key === 'Enter') $('#go').click(); });
$('#chg1').onclick = $('#chg2').onclick = () => askCode();

function start(c){
  code = c; ls.set('mbCode', c); games = {}; current = null; shownKey = '';
  show('vWait'); $('#waitT').textContent = 'Connecting…'; $('#waitMsg').textContent = '';
  connect();
  // nothing after a while: probably no game yet, or a wrong code
  setTimeout(() => { if(!current && code === c){ $('#waitT').textContent = 'Waiting for the game to start…'; $('#waitMsg').textContent = `Code ${c}. Your card appears as soon as Andrew starts the music. If nothing happens, check the code.`; } }, 4000);
}
function connect(){
  if(es) es.close();
  es = new EventSource(`${RELAY}/${PREFIX}${code.toLowerCase()}/sse?since=12h`);
  es.onopen = () => setStat(true, 'Connected');
  es.onerror = () => setStat(false, 'Reconnecting… (check your internet)');
  es.onmessage = ev => {
    let d; try{ d = JSON.parse(ev.data); }catch(e){ return; }
    if(d.event && d.event !== 'message') return;
    let m; try{ m = JSON.parse(d.message); }catch(e){ return; }
    if(m.mb !== 'cards' || !m.id) return;
    const key = m.id + ':' + m.v, g = games[key] ||= {id: m.id, v: m.v, name: m.name, of: m.of, parts: {}, t: 0};
    g.parts[m.part] = m.titles; g.name = m.name; g.t = Math.max(g.t, d.time || 0);
    if(Object.keys(g.parts).length === g.of){
      g.songs = []; for(let i = 0; i < g.of; i++) g.songs.push(...g.parts[i]);
      if(!current || g.t >= current.t){ current = g; render(); }
    }
  };
}
// keep the connection when the phone wakes up
document.addEventListener('visibilitychange', () => { if(!document.hidden && code && (!es || es.readyState === 2)) connect(); });

function render(){
  const g = current; if(!g || g.songs.length < CELLS) return;
  const key = g.id + ':' + g.v;
  let mine = ls.get('mbCard:' + key);
  if(!mine){ const a = new Uint32Array(1); crypto.getRandomValues(a); mine = {n: 100000 + a[0] % 900000, dabs: []}; ls.set('mbCard:' + key, mine); }
  const titles = dealDigital(g.id, g.v, g.songs, mine.n);
  if(shownKey && shownKey !== key){ $('#banner').hidden = false; $('#banner').textContent = `🎵 New game: ${g.name}. Here's your new card!`; setTimeout(() => $('#banner').hidden = true, 12000); }
  shownKey = key;
  $('#pname').textContent = g.name;
  $('#cno').textContent = mine.n;
  $('#qr').innerHTML = QR.svg(`MB1D:${g.id}:${g.v}:${mine.n}`);
  const grid = $('#grid'); grid.innerHTML = '';
  for(let c = 0, k = 0; c < 25; c++){
    const d = document.createElement('div'); d.className = 'cell';
    if(c === 12){ d.classList.add('free', 'on'); d.textContent = 'FREE'; }
    else {
      const i = k++; const sp = document.createElement('span'); sp.textContent = titles[i]; d.append(sp);
      if(mine.dabs.includes(i)) d.classList.add('on');
      d.onclick = () => { const j = mine.dabs.indexOf(i); if(j < 0) mine.dabs.push(i); else mine.dabs.splice(j, 1); d.classList.toggle('on'); ls.set('mbCard:' + key, mine); };
    }
    grid.append(d);
  }
  show('vCard'); fit();
}
// shrink long titles until they fit their square
// Words stay whole: the text gets smaller until every word fits on its line. Only a word too long to fit
// even at the smallest size is allowed to break.
function fit(){
  for(const d of document.querySelectorAll('.cell:not(.free)')){
    const sp = d.firstChild, avail = d.clientHeight - 4;
    const ok = () => sp.scrollWidth <= sp.clientWidth + 0.5 && sp.offsetHeight <= avail;
    d.classList.remove('brk');
    let s = 16; d.style.fontSize = s + 'px';
    while(s > 7 && !ok()){ s -= 0.5; d.style.fontSize = s + 'px'; }
    if(!ok()){ d.classList.add('brk'); s = 16; d.style.fontSize = s + 'px'; while(s > 6 && !ok()){ s -= 0.5; d.style.fontSize = s + 'px'; } }
  }
}
if(document.fonts) document.fonts.ready.then(() => { if(!$('#vCard').hidden) fit(); });
window.addEventListener('resize', () => { if(!$('#vCard').hidden) fit(); });

const first = (hp.get('c') || ls.get('mbCode') || '').toUpperCase().replace(/[^A-Z]/g, '');
if(first.length === 4) start(first); else askCode();
</script>
</body>
</html>
